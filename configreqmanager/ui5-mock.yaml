# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zcapstone.configreqmanager
type: application
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
          apps:
            - target: /configmmroute
              local: ../../configmmroute/configmmroute
              intent:
                object: MMRoute
                action: review
            - target: /configfilimit
              local: ../../configfilimit/configfilimit
              intent:
                object: FILimit
                action: review
            - target: /configsdprice
              local: ../../configsdprice/configsdprice
              intent:
                object: SDPrice
                action: review
            - target: /configmmsafestock
              local: ../../configmmsafestock/configmmsafestock
              intent:
                object: MMSafeStock
                action: review
    - name: sap-fe-mockserver
      afterMiddleware: fiori-tools-appreload
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata4/iwbep/all/srvd/sap/zsd_conf_req/0001
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
            resolveExternalServiceReferences: true
          - urlPath: /sap/opu/odata4/iwbep/all/srvd/sap/zsd_fi_limit_conf/0001
            metadataPath: ../../configfilimit/configfilimit/webapp/localService/mainService/metadata.xml
            mockdataPath: ../../configfilimit/configfilimit/webapp/localService/mainService/data
            generateMockData: true
            resolveExternalServiceReferences: true
          - urlPath: /sap/opu/odata4/iwbep/all/srvd/sap/zsd_sd_price_conf/0001
            metadataPath: ../../configsdprice/configsdprice/webapp/localService/mainService/metadata.xml
            mockdataPath: ../../configsdprice/configsdprice/webapp/localService/mainService/data
            generateMockData: true
            resolveExternalServiceReferences: true
          - urlPath: /sap/opu/odata4/iwbep/all/srvd/sap/zsd_mm_route_conf/0001
            metadataPath: ../../configmmroute/configmmroute/webapp/localService/mainService/metadata.xml
            mockdataPath: ../../configmmroute/configmmroute/webapp/localService/mainService/data
            generateMockData: true
            resolveExternalServiceReferences: true
          - urlPath: /sap/opu/odata4/iwbep/all/srvd/sap/zsd_mm_safe_stock/0001
            metadataPath: ../../configmmsafestock/configmmsafestock/webapp/localService/mainService/metadata.xml
            mockdataPath: ../../configmmsafestock/configmmsafestock/webapp/localService/mainService/data
            generateMockData: true
            resolveExternalServiceReferences: true
          - urlPath: /sap/opu/odata4/iwbep/all/srvd/sap/zsd_audit_log/0001
            metadataPath: ../../audittrail/audittrailformanager/webapp/localService/mainService/metadata.xml
            mockdataPath: ../../audittrail/audittrailformanager/webapp/localService/mainService/data
            generateMockData: true
            resolveExternalServiceReferences: true
        annotations: []
    - name: fiori-tools-proxy
      afterMiddleware: sap-fe-mockserver
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: https://s40lp1.ucc.cit.tum.de
            client: '324'
